                  format: binary
      responses:
        '200':
          description: Avatar subido
    get:
      summary: Obtener avatar por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Imagen devuelta
          content:
            image/png: {}
            image/jpeg: {}

  /api/v1/users/me/avatar:
