openapi: 3.0.3
info:
  title: MemoWorks API
  description: API REST para la aplicación MemoWorks (backend). Especificación generada automáticamente a partir del código fuente.
  version: 1.0.0
servers:
  - url: https://api.memoworks.com/v1
    description: Servidor de producción
  - url: http://localhost:8080/api/v1
    description: Servidor local
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRequestDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 25
        surnames:
          type: string
          maxLength: 25
        username:
          type: string
          maxLength: 20
        phoneNumber:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 20
        tasks:
          type: array
          items:
            type: integer
            description: ID de la tarea (objeto Task completo se omite)
        rol:
          type: string
          description: Rol del usuario (VER enum Rol en código)
        avatar:
          type: string
          description: URL o nombre de fichero del avatar
        groups:
          type: array
          items:
            type: integer
            description: ID de grupo (objeto Group completo se omite)
      required: []

    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        surnames:
          type: string
        username:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        tasksIds:
          type: array
          items:
            type: integer
        rol:
          type: string
        avatar:
          type: string
        groupIds:
          type: array
          items:
            type: integer

    GroupRequestDTO:
      type: object
      properties:
        name:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 100
        adminUser:
          type: integer
          description: ID del usuario administrador (objeto User en código)
        users:
          type: array
          items:
            type: integer
            description: ID de usuario
        image:
          type: string

    GroupResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        adminUser:
          type: integer
          description: ID del usuario administrador
        users:
          type: array
          items:
            type: integer
        image:
          type: string

    TaskRequestDTO:
      type: object
      properties:
        title:
          type: string
          maxLength: 25
        description:
          type: string
          maxLength: 500
        date:
          type: string
          format: date
        time:
          type: string
          example: "13:45:00"
        assigmentFor:
          type: integer
          description: ID del usuario asignado
        status:
          type: boolean
        labels:
          type: array
          items:
            type: string
        image:
          type: string
      required: [date, time, assigmentFor, status, labels]

    TaskResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        assigmentFor:
          type: integer
          description: ID del usuario asignado
        status:
          type: boolean
        labels:
          type: array
          items:
            type: string
        image:
          type: string

    NotificationRequestDTO:
      type: object
      properties:
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        userEmail:
          type: string
          format: email

    NotificationResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        userEmail:
          type: string
          format: email

    PasswordForgotRequestDTO:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    PasswordResetConfirmDTO:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
      required: [token, newPassword]

    UserLoginDTO:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

paths:
  /api/v1/auth/authenticate:
    post:
      summary: Autenticar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginDTO'
      responses:
        '200':
          description: Devuelve JWT en body y en cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /api/v1/auth/logout:
    post:
      summary: Cerrar sesión (añade token a blacklist y elimina cookie)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout exitoso
  /api/v1/auth/register:
    post:
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestDTO'
      responses:
        '200':
          description: Usuario registrado y token devuelto

  /api/v1/auth/password/forgot:
    post:
      summary: Solicitar restablecimiento de contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequestDTO'
      responses:
        '200':
          description: Respuesta genérica indicando envío

  /api/v1/auth/password/verify:
    get:
      summary: Verificar token de restablecimiento
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token válido
        '400':
          description: Token inválido

  /api/v1/auth/password/reset:
    post:
      summary: Confirmar restablecimiento de contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmDTO'
      responses:
        '200':
          description: Contraseña actualizada

  /api/v1/users:
    get:
      summary: Listar usuarios (paginado)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestDTO'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'

  /api/v1/users/id/{id}:
    get:
      summary: Obtener usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'

  /api/v1/users/username/{username}:
    get:
      summary: Obtener usuario por nombre de usuario
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'

  /api/v1/users/email/{email}:
    get:
      summary: Obtener usuario por email
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'

  /api/v1/users/{id}:
    put:
      summary: Actualizar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestDTO'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
    delete:
      summary: Eliminar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Usuario eliminado

  /api/v1/users/email-exists:
    get:
      summary: Verificar existencia de correo
      parameters:
        - name: email
          in: query
          schema:
            type: string
            format: email
      responses:
